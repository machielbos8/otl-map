name: Build, test and publish

# A tag vX.Y.Z builds the source distribution and the wheels, tests every wheel and publishes to PyPI.
# A tag vX.Y.ZrcN does the same but publishes to TestPyPI only (dry run).
# Publishing uses PyPI trusted publishing (OIDC): environments "pypi" and "testpypi" of this repository.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # build and test only (no tag, so nothing is published)

jobs:

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tag and package version agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/otl_map/__init__.py)
          echo "package $V, tag ${GITHUB_REF_NAME#v}"
          test "$V" = "${GITHUB_REF_NAME#v}"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist/
      - name: Install from the sdist (compiles) and test
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install --quiet "$(ls dist/*.tar.gz)[test]"
          mkdir /tmp/t && cp -r tests /tmp/t/ && cd /tmp/t && /tmp/v/bin/python -m pytest -q -p no:cacheprovider tests
      - uses: actions/upload-artifact@v6
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  wheels:
    name: Wheels ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and test the wheels
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_* *-win32 *_i686"
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: "pytest -q -p no:cacheprovider {project}/tests"
        run: |
          python -m pip install --upgrade "cibuildwheel>=3.2"
          python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v6
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish_testpypi:
    name: Publish to TestPyPI (rc tags)
    needs: [sdist, wheels]
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, 'rc')
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish_pypi:
    name: Publish to PyPI (release tags)
    needs: [sdist, wheels]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'rc')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
